name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build; unit, property and kill -9 crash tests; HTTP and Testcontainers parity tests
        run: ./gradlew build --no-daemon
      - name: Fault-injection run (3 nodes, RF=2, kill -9, SIGSTOP and link drops under load)
        run: |
          ./gradlew --no-daemon :bench:installDist
          bench/build/install/bench/bin/bench faults --jar server/build/libs/metricsdb.jar \
            --duration 45 --series 200 --ticks-per-s 5 --seed $GITHUB_RUN_NUMBER --out run/faults-ci.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            run/
