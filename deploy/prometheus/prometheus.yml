global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: metricsdb
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9201']
        labels: {instance: single}
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9391']
remote_write:
  - url: http://127.0.0.1:9201/api/v1/write
    queue_config:
      max_samples_per_send: 2000
      batch_send_deadline: 2s
