# Demo: a real Prometheus scrapes MetricsDB's own /metrics and remote-writes everything into
# MetricsDB; Grafana uses MetricsDB as a Prometheus data source. MetricsDB itself runs outside
# Docker on 127.0.0.1:9201 (scripts/demo.sh starts it). Host networking, every port on 127.0.0.1.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9391
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:13.0.10
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3301"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_RENDERING_RENDERER_TOKEN: metricsdb-demo-renderer
      GF_RENDERING_SERVER_URL: http://127.0.0.1:8381/render
      GF_RENDERING_CALLBACK_URL: http://127.0.0.1:3301/
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  renderer:
    image: grafana/grafana-image-renderer:v5.12.5
    network_mode: host
    command: ["server"]
    environment:
      SERVER_ADDR: "127.0.0.1:8381"
      AUTH_TOKEN: metricsdb-demo-renderer
